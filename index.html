<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Guard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --surface: rgba(18, 27, 43, .94);
            --surface-soft: rgba(255, 255, 255, .08);
            --border: rgba(255, 255, 255, .14);
            --text: #f5f7fb;
            --muted: #aeb9c9;
            --blue: #5b8def;
            --gold: #e3ad4f;
            --danger: #e66b6b;
        }
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; background: #0a111d; color: var(--text);
        }
        #game { display: flex; flex-direction: column; max-width: calc(100vw - 32px); filter: drop-shadow(0 18px 36px rgba(0, 0, 0, .45)); }
        .stage { position: relative; line-height: 0; }
        canvas { display: block; border: 1px solid rgba(255, 255, 255, .12); border-radius: 4px; }
        #ui-root { position: absolute; inset: 0; z-index: 10; line-height: 1.4; pointer-events: none; }
        button, input { font: inherit; }
        button { border: 0; cursor: pointer; }
        .screen { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; }
        .screen[data-menu] { background: radial-gradient(circle at 50% 35%, rgba(42, 76, 111, .7), rgba(8, 15, 26, .9) 72%); }
        .screen[hidden], .test-screen[hidden], .drawer[hidden] { display: none; }
        .menu-card { width: min(420px, calc(100% - 36px)); padding: 36px; border: 1px solid var(--border); border-radius: 20px; background: rgba(12, 21, 35, .92); box-shadow: 0 24px 70px rgba(0, 0, 0, .42); text-align: left; }
        .eyebrow, .hud-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
        .menu-card h1 { margin: 8px 0 10px; font-size: 42px; line-height: 1; letter-spacing: -.05em; }
        .menu-card p { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
        .primary-button { width: 100%; padding: 13px 18px; border-radius: 10px; background: var(--blue); color: white; font-size: 14px; font-weight: 700; transition: transform .15s ease, filter .15s ease; }
        .primary-button:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .menu-card .secondary-button { width: 100%; margin-top: 10px; }
        .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .hud[hidden] { display: none; }
        .hud-top { padding-bottom: 8px; }
        .hud-bottom { justify-content: center; padding-top: 6px; }
        .hud-stats, .hud-actions { display: flex; align-items: center; gap: 6px; }
        .hud-stat { min-width: 74px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); line-height: 1.25; }
        .hud-stat strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; }
        .hud-label { font-size: 9px; }
        .aim-stat { min-width: 60px; text-align: right; }
        .status-line { color: var(--muted); font-size: 13px; text-align: center; }
        .projectile-bar { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
        .icon-button { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); color: var(--text); }
         .projectile-button { padding: 7px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
         .projectile-button b { display: inline-grid; width: 18px; height: 18px; margin-right: 4px; place-items: center; border-radius: 5px; background: rgba(255,255,255,.1); color: var(--text); }
         .projectile-button:hover, .projectile-button.active { border-color: var(--gold); background: rgba(227,173,79,.16); color: var(--text); }
        .drawer { position: absolute; top: 14px; right: 14px; width: min(330px, calc(100% - 28px)); padding: 22px; border: 1px solid var(--border); border-radius: 16px; background: #121d2e; box-shadow: 0 22px 50px rgba(0, 0, 0, .42); pointer-events: auto; }
        .drawer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .drawer h2 { margin: 0; font-size: 18px; }
        .field { margin-top: 18px; }
        .field-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .field-value { color: var(--blue); font-size: 12px; font-weight: 700; }
        input[type="range"] { width: 100%; accent-color: var(--blue); }
        .toggle-field { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); }
        .sandbox-screen { background: rgba(8, 15, 26, .55); overflow-y: auto; }
        .sandbox-card { width: min(760px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow-y: auto; padding: 22px 24px; border: 1px solid var(--border); border-radius: 16px; background: rgba(12, 21, 35, .94); box-shadow: 0 24px 70px rgba(0, 0, 0, .42); }
        .sandbox-card h2 { margin: 4px 0 14px; font-size: 24px; letter-spacing: -.03em; }
        .sandbox-fields { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
        .sandbox-fields .field { display: flex; flex-direction: column; gap: 6px; margin: 0; }
        .sandbox-card select, .sandbox-card input[type="number"] { min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255, 255, 255, .06); color: var(--text); font-size: 13px; }
        .sandbox-fields input[type="number"] { width: 110px; }
        .wave-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .wave-table th { padding: 6px 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
        .wave-table td { padding: 4px; border-top: 1px solid rgba(255, 255, 255, .06); }
        .wave-table input[type="number"] { width: 58px; }
        .wave-number, .wave-total { color: var(--muted); font-weight: 700; }
        .sandbox-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .sound-lab-card { width: min(820px, calc(100% - 28px)); }
        .sound-volumes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
        .sound-volumes .field { margin: 0; }
        .sound-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, .06); }
        .sound-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
        .sound-info span { color: var(--muted); font-size: 13px; }
        .sound-info small { color: var(--muted); font-size: 11px; opacity: .8; }
        .sound-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        .sound-variants { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 220px; }
        .chip-button { min-width: 26px; padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-soft); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; }
        .chip-button:hover { background: rgba(255, 255, 255, .14); }
        .music-progress { height: 4px; margin-top: 4px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
        .music-progress div { height: 100%; width: 0; background: var(--blue); }
        .sandbox-actions .primary-button { width: auto; padding: 10px 22px; }
        .end-card { width: min(360px, calc(100% - 36px)); padding: 28px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); text-align: center; pointer-events: auto; }
        .end-card h2 { margin: 0 0 8px; font-size: 26px; }
        .end-card p { margin: 0 0 20px; color: var(--muted); }
        .test-screen { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; pointer-events: none; }
        .secondary-button[hidden] { display: none; }
        .secondary-button { padding: 10px 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); color: var(--text); font-weight: 700; pointer-events: auto; }
        .secondary-button:hover { background: rgba(255, 255, 255, .14); }
         @media (max-width: 700px) {
            .hud { flex-wrap: wrap; justify-content: center; }
            .hud-stats { flex-wrap: wrap; justify-content: center; }
            .hud-stat { min-width: 0; padding: 5px 7px; }
             .projectile-button { padding: 6px; font-size: 10px; }
         }
    </style>
</head>
<body>
    <div id="game"></div>
</body>
</html>
