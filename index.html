<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Guard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Landscape-style UI: flat shapes, cream panels, chunky buttons; accent and backdrop follow the map. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --display: 'Fredoka', ui-rounded, system-ui, sans-serif;
            --body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --backdrop: #20363b;
            --accent: #3f6965;
            --panel: #f6f1e4;
            --panel-edge: #ded3ba;
            --panel-sunk: #ebe3d0;
            --ink: #2c3a38;
            --ink-soft: #66756f;
            --gold: #f1c45a;
            --gold-edge: #c4932f;
            --gold-ink: #4a3510;
            --good: #5aa36f;
            --warn: #e3a447;
            --bad: #d8614f;
            font-family: var(--body);
            color-scheme: light;
        }
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; color: var(--ink);
            background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--backdrop) 80%, white), var(--backdrop) 70%);
            transition: background .4s ease;
        }
        #game { display: flex; flex-direction: column; max-width: calc(100vw - 32px); }
        .stage { position: relative; line-height: 0; }
        canvas { display: block; border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35); }
        #ui-root { position: absolute; inset: 0; z-index: 10; line-height: 1.4; pointer-events: none; border-radius: 14px; overflow: hidden; }
        button, input, select { font: inherit; }
        button { border: 0; cursor: pointer; }
        [hidden] { display: none !important; }

        /* ---------- Buttons ---------- */
        .primary-button, .secondary-button, .round-button, .chip-button, .weapon-slot {
            font-family: var(--display); font-weight: 600; transition: transform .08s ease, filter .15s ease; pointer-events: auto;
        }
        .primary-button { padding: 12px 22px; border-radius: 14px; background: var(--gold); color: var(--gold-ink); font-size: 18px; box-shadow: 0 5px 0 var(--gold-edge), 0 10px 18px rgba(0, 0, 0, .18); }
        .secondary-button { padding: 10px 18px; border-radius: 14px; background: var(--panel); color: var(--ink); font-size: 16px; box-shadow: 0 4px 0 var(--panel-edge), 0 8px 14px rgba(0, 0, 0, .12); }
        .small-button { padding: 7px 14px; font-size: 14px; border-radius: 12px; }
        .round-button { display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: var(--panel); color: var(--ink); font-size: 22px; line-height: 1; box-shadow: 0 4px 0 var(--panel-edge); }
        .segmented { display: flex; gap: 6px; }
        .chip-button.active { background: var(--accent); color: #fff; }
        .chip-button { min-width: 28px; padding: 4px 8px; border-radius: 9px; background: var(--panel-sunk); color: var(--ink); font-size: 13px; box-shadow: 0 2px 0 var(--panel-edge); }
        .primary-button:hover, .secondary-button:hover, .round-button:hover, .chip-button:hover, button.weapon-slot:hover { filter: brightness(1.04); }
        .primary-button:active, .secondary-button:active, .round-button:active, .chip-button:active { transform: translateY(3px); }
        .key-hint { margin-left: 8px; font-size: 12px; opacity: .6; }

        /* ---------- Screens ---------- */
        .screen { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; }
        /* Overlays are laid out for a canvas at scale 1 and zoom with it (--ui-scale, set by DomUi.fitCanvas). */
        .menu-stack, .panel-card, .end-card, .drawer, .test-screen { zoom: var(--ui-scale, 1); }
        .menu-screen { background: transparent; }
        .menu-stack { display: flex; flex-direction: column; align-items: center; transform: translateY(-9%); text-align: center; }
        .logo { font-family: var(--display); font-weight: 700; font-size: 72px; line-height: 1; color: #fffdf6; text-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 80%, black), 0 12px 24px rgba(20, 40, 40, .35); }
        .tagline { font-family: var(--display); font-weight: 500; font-size: 16px; color: #fbf8ee; margin: 10px 0 22px; text-shadow: 0 2px 0 rgba(30, 60, 60, .8), 0 0 12px rgba(30, 60, 60, .55); }
        .menu-card { display: flex; flex-direction: column; gap: 14px; width: 300px; padding: 18px; border-radius: 22px; background: rgba(246, 241, 228, .92); box-shadow: 0 16px 40px rgba(30, 60, 60, .25); }
        .dev-toggle { font-family: var(--display); font-size: 14px; color: var(--ink-soft); background: none; }
        .dev-tools { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .eyebrow, .hud-label { color: var(--ink-soft); font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

        /* ---------- HUD (outside the canvas) ---------- */
        .hud { display: flex; align-items: center; gap: 8px; }
        .hud-top { padding-bottom: 12px; }
        .hud-bottom { justify-content: center; padding-top: 10px; }
        .hud-chip { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 11px; border-radius: 14px; background: var(--panel); color: var(--ink); box-shadow: 0 4px 0 var(--panel-edge); line-height: 1.15; }
        .hud-chip .icon { width: 28px; height: 28px; flex-shrink: 0; }
        .chip-label { font-family: var(--display); font-weight: 600; font-size: 13px; white-space: nowrap; }
        .chip-value { font-size: 11px; color: var(--ink-soft); white-space: nowrap; margin-top: 2px; }
        .meter { width: 86px; height: 10px; margin-top: 4px; border-radius: 6px; background: var(--panel-sunk); overflow: hidden; }
        .meter i { display: block; width: 100%; height: 100%; border-radius: 6px; background: var(--accent); transition: width .25s ease, background .25s ease; }
        .pips { display: flex; flex-wrap: wrap; gap: 2px; max-width: 120px; margin-top: 4px; }
        .pip svg { display: block; width: 13px; height: 13px; fill: var(--ink); }
        .pip .pip-eye { fill: var(--panel); }
        .pip.defeated svg { fill: #cfc6b2; }
        .hud-spacer { flex: 1; }
        .weapons { display: flex; gap: 9px; }
        .weapon { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .weapon-slot { position: relative; display: grid; place-items: center; width: 50px; height: 50px; padding: 0; border-radius: 12px; background: var(--panel); box-shadow: 0 4px 0 var(--panel-edge); }
        .weapon-slot.active { background: var(--gold); box-shadow: 0 4px 0 var(--gold-edge); transform: translateY(-3px); }
        .weapon-slot.empty { background: transparent; box-shadow: none; border: 2px dashed color-mix(in srgb, var(--panel) 45%, transparent); }
        .weapon-slot.empty .weapon-key { opacity: .5; }
        .weapon-art { width: 40px; height: 40px; }
        .weapon-key { position: absolute; top: -7px; left: -6px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font-family: var(--display); font-size: 11px; }
        .weapon-ammo { min-width: 30px; padding: 0 8px; border-radius: 999px; background: var(--panel); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 13px; line-height: 18px; text-align: center; box-shadow: 0 2px 0 var(--panel-edge); }
        .weapon:has(.empty) .weapon-ammo { background: transparent; box-shadow: none; color: color-mix(in srgb, var(--panel) 55%, transparent); }
        .status-banner { max-width: 100%; padding: 6px 22px; border-radius: 999px; background: var(--panel); color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 14px; box-shadow: 0 3px 0 var(--panel-edge); text-align: center; }

        /* ---------- Settings drawer ---------- */
        .drawer { position: absolute; top: 14px; right: 14px; width: min(320px, calc(100% - 28px)); padding: 18px 20px 20px; border-radius: 20px; background: var(--panel); color: var(--ink); box-shadow: 0 6px 0 var(--panel-edge), 0 22px 50px rgba(0, 0, 0, .3); pointer-events: auto; }
        .drawer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .drawer h2 { font-family: var(--display); font-weight: 600; font-size: 22px; }
        .drawer .round-button { width: 36px; height: 36px; background: var(--panel-sunk); box-shadow: 0 3px 0 var(--panel-edge); }
        .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font-family: var(--display); font-weight: 500; font-size: 15px; }
        .toggle-field { flex-direction: row; align-items: center; justify-content: space-between; cursor: pointer; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        input[type="checkbox"] { appearance: none; position: relative; width: 42px; height: 24px; flex-shrink: 0; border-radius: 12px; background: var(--panel-edge); cursor: pointer; transition: background .15s ease; }
        input[type="checkbox"]::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s ease; }
        input[type="checkbox"]:checked { background: var(--accent); }
        input[type="checkbox"]:checked::after { transform: translateX(18px); }

        /* ---------- Panels: sandbox setup, sound lab ---------- */
        .panel-screen { background: color-mix(in srgb, var(--backdrop) 35%, transparent); overflow-y: auto; }
        .panel-card { width: min(760px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow-y: auto; padding: 20px 24px; border-radius: 22px; background: rgba(246, 241, 228, .96); color: var(--ink); box-shadow: 0 6px 0 var(--panel-edge), 0 24px 60px rgba(0, 0, 0, .3); }
        .panel-card h2 { margin: 2px 0 10px; font-family: var(--display); font-weight: 600; font-size: 28px; }
        /* Sandbox setup: levels as tabs, the selected level's map cards and enemy steppers. */
        .panel-card[data-sandbox-form] { width: min(780px, calc(100% - 28px)); }
        .panel-card select, .panel-card input[type="number"] { min-width: 0; padding: 5px 8px; border: 0; border-radius: 9px; background: var(--panel-sunk); color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 15px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .06); }
        .sandbox-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
        .sandbox-head h2 { margin-bottom: 0; }
        .sandbox-health { display: flex; gap: 10px; }
        .health-field { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; border-radius: 12px; background: var(--panel-sunk); }
        .health-field .icon { width: 22px; height: 22px; }
        .health-field span { color: var(--ink-soft); font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
        .health-field input[type="number"] { width: 78px; background: var(--panel); box-shadow: none; }
        .level-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
        .level-tab { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 14px 14px 0 0; background: var(--panel-sunk); color: var(--ink); text-align: left; box-shadow: inset 0 -3px 0 var(--panel-edge); pointer-events: auto; }
        .level-tab .map-thumb { width: 36px; height: 27px; border-radius: 7px; }
        .level-tab-text { display: flex; flex-direction: column; line-height: 1.15; }
        .level-tab strong { font-family: var(--display); font-weight: 600; font-size: 15px; }
        .level-tab small { color: var(--ink-soft); font-size: 11px; }
        .level-tab.active { background: #fffaf0; box-shadow: inset 0 3px 0 var(--gold); }
        .level-add, .level-remove { padding: 6px 12px; border-radius: 12px; background: none; color: var(--accent); font-family: var(--display); font-weight: 600; font-size: 14px; pointer-events: auto; }
        .level-add { align-self: center; border: 2px dashed var(--panel-edge); }
        .level-add:hover, .level-remove:hover { background: var(--panel-sunk); }
        .level-remove { color: var(--bad); }
        .level-editor { padding: 8px 14px 14px; border-radius: 0 14px 14px 14px; background: #fffaf0; box-shadow: 0 3px 0 var(--panel-edge); }
        .level-editor-head { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
        .level-editor-head .sandbox-section-label { margin: 0; }
        .sandbox-section-label { margin: 10px 0 6px; color: var(--ink-soft); font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
        .sandbox-section-label span { margin-left: 4px; padding: 1px 7px; border-radius: 8px; background: var(--accent); color: #fff; letter-spacing: 0; }
        .map-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .map-card { display: flex; align-items: center; gap: 7px; padding: 5px 8px 5px 5px; text-align: left; line-height: 1.15; border-radius: 12px; background: var(--panel-sunk); color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 12px; box-shadow: 0 3px 0 var(--panel-edge); outline: 3px solid transparent; outline-offset: 1px; transition: transform .08s ease, outline-color .15s ease; pointer-events: auto; }
        .map-card .map-thumb { flex-shrink: 0; width: 44px; height: 33px; border-radius: 7px; }
        .map-card:hover { transform: translateY(-1px); }
        .map-card.active { outline-color: var(--gold); box-shadow: 0 3px 0 var(--gold-edge); }
        .enemy-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .enemy-card { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; column-gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--panel-sunk); transition: opacity .15s ease; }
        .enemy-card .icon { grid-row: span 2; width: 30px; height: 30px; }
        .enemy-card.empty { opacity: .55; }
        .enemy-name { font-family: var(--display); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stepper { display: flex; align-items: center; gap: 4px; }
        .stepper button { width: 24px; height: 24px; border-radius: 8px; background: var(--panel); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1; box-shadow: 0 2px 0 var(--panel-edge); pointer-events: auto; }
        .stepper button:disabled { opacity: .35; cursor: default; }
        .stepper output { min-width: 22px; font-family: var(--display); font-weight: 600; font-size: 16px; text-align: center; }
        .sandbox-pages { display: flex; gap: 4px; margin-right: auto; padding: 4px; border-radius: 14px; background: var(--panel-sunk); }
        .sandbox-page { padding: 6px 16px; border-radius: 10px; background: none; color: var(--ink-soft); font-family: var(--display); font-weight: 600; font-size: 15px; pointer-events: auto; }
        .sandbox-page:hover { color: var(--ink); }
        .sandbox-page.active { background: #fffaf0; color: var(--ink); box-shadow: 0 2px 0 var(--panel-edge); }
        /* Quiver page: the five weapon slots, then a card per arrow type. */
        .quiver-editor { padding: 8px 12px 12px; border-radius: 14px; background: #fffaf0; box-shadow: 0 3px 0 var(--panel-edge); }
        .quiver-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
        .quiver-row .sandbox-section-label { margin: 0; white-space: nowrap; }
        .quiver-slots { display: flex; gap: 20px; padding-top: 8px; }
        .quiver-slot-wrap { position: relative; }
        .quiver-slot { width: 50px; height: 50px; pointer-events: auto; outline: 3px solid transparent; outline-offset: 2px; transition: transform .08s ease, outline-color .15s ease; }
        .quiver-slot .weapon-art { width: 40px; height: 40px; }
        .quiver-slot.empty { border-color: var(--panel-edge); }
        .quiver-slot.selected { outline-color: var(--gold); transform: translateY(-3px); }
        .quiver-clear { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 10px; background: var(--panel); color: var(--bad); font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1; box-shadow: 0 2px 0 var(--panel-edge); pointer-events: auto; }
        .arrow-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .arrow-card { position: relative; display: flex; align-items: center; gap: 7px; padding: 4px 22px 4px 4px; border-radius: 10px; background: var(--panel-sunk); color: var(--ink); text-align: left; box-shadow: 0 2px 0 var(--panel-edge); transition: transform .08s ease; pointer-events: auto; }
        .arrow-card:hover { transform: translateY(-1px); }
        .arrow-card .weapon-art { flex-shrink: 0; width: 32px; height: 32px; padding: 1px; border-radius: 8px; background: var(--panel); }
        .arrow-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
        .arrow-text strong { font-family: var(--display); font-weight: 600; font-size: 12.5px; }
        .arrow-text small { color: var(--ink-soft); font-size: 10.5px; }
        .arrow-slot { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-family: var(--display); font-size: 10px; }
        .arrow-card:not(.packed) { opacity: .7; }
        .arrow-card, .quiver-slot:not(.empty) { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .quiver-dragging, .quiver-dragging * { cursor: grabbing !important; }
        .quiver-slot.drop-target { outline-color: var(--accent); transform: translateY(-3px) scale(1.06); }
        .quiver-ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .3)); }
        .quiver-ghost .weapon-art { width: 100%; height: 100%; }
        .partner-quiver { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 2px dashed var(--panel-edge); }
        .partner-quiver .sandbox-section-label { margin: 0; white-space: nowrap; }
        .partner-slots { display: flex; gap: 10px; }
        .partner-slots .weapon-slot { width: 40px; height: 40px; cursor: default; }
        .partner-slots .weapon-slot .weapon-art { width: 32px; height: 32px; }
        .partner-slots .weapon-slot.empty { border-color: var(--panel-edge); }
        .partner-waiting { color: var(--ink-soft); font-size: 14px; }
        .coop-body > .partner-quiver { flex-direction: column; gap: 6px; margin-top: 0; padding-top: 0; border-top: 0; }
        .sandbox-actions { position: sticky; bottom: -20px; display: flex; justify-content: flex-end; gap: 12px; margin: 14px -24px -20px; padding: 10px 24px 16px; background: rgba(246, 241, 228, .97); }
        .map-thumb { display: block; }
        .sound-lab-card { width: min(820px, calc(100% - 28px)); }
        .sound-volumes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 6px; }
        .sound-volumes .field { margin: 0; }
        .sound-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--panel-edge); }
        .sound-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
        .sound-info strong { font-family: var(--display); font-weight: 600; font-size: 16px; }
        .sound-info span { color: var(--ink-soft); font-size: 13px; }
        .sound-info small { color: var(--ink-soft); font-size: 11px; opacity: .85; }
        .sound-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
        .sound-actions .secondary-button { padding: 7px 14px; font-size: 14px; background: var(--panel-sunk); }
        .sound-variants { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 230px; }
        .music-progress { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--panel-sunk); overflow: hidden; }
        .music-progress div { height: 100%; width: 0; background: var(--accent); }

        /* ---------- End screen (the battle keeps going behind it) ---------- */
        .end-screen { background: rgba(20, 30, 32, .18); }
        .coop-card { width: min(380px, calc(100% - 28px)); text-align: center; }
        .coop-card.coop-wide { width: min(760px, calc(100% - 28px)); }
        .coop-card .quiver-editor { text-align: left; }
        .coop-body { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
        .coop-copy, .coop-status { margin: 0; font-size: 15px; line-height: 1.4; }
        .coop-status { font-family: var(--display); font-weight: 500; }
        .coop-error { margin: 0; color: var(--bad); font-size: 14px; }
        .coop-join { display: flex; gap: 8px; }
        .coop-join input { flex: 1; min-width: 0; padding: 9px 12px; border: 0; border-radius: 12px; background: var(--panel-sunk); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .06); }
        .coop-code { padding: 10px; border-radius: 14px; background: var(--panel-sunk); font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .2em; }
        .end-card { display: flex; flex-direction: column; align-items: center; width: min(380px, calc(100% - 36px)); padding: 24px 26px 26px; border-radius: 22px; background: rgba(246, 241, 228, .95); color: var(--ink); text-align: center; box-shadow: 0 6px 0 var(--panel-edge), 0 24px 60px rgba(0, 0, 0, .3); pointer-events: auto; }
        .end-card h2 { font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1.1; }
        .end-card h2[data-outcome="win"] { color: var(--good); }
        .end-card h2[data-outcome="loss"] { color: var(--bad); }
        .end-card p { margin: 6px 0 14px; color: var(--ink-soft); }
        .end-stats { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
        .end-stats div { display: flex; flex-direction: column; min-width: 84px; padding: 6px 8px; border-radius: 12px; background: var(--panel-sunk); }
        .end-stats strong { font-family: var(--display); font-weight: 600; font-size: 17px; }
        .end-stats span { font-size: 11px; color: var(--ink-soft); }

        /* ---------- Animation lab buttons (over its own canvas backdrop; --view-inset keeps them on the centred panel in wide views) ---------- */
        .test-screen { position: absolute; top: 14px; right: calc(14px + var(--view-inset, 0px)); display: flex; gap: 8px; pointer-events: none; }

        @media (max-width: 760px) {
            .hud { flex-wrap: wrap; justify-content: center; }
            .hud-spacer { display: none; }
