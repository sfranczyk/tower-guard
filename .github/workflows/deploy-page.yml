name: Deploy to GitHub Pages

# One Pages site, two pages:
#   /      production  = the latest v* tag (promoted with /release)
#   /dev/  development = master, redeployed on every push
# Each run rebuilds both halves (scripts/build-pages.sh), so a deploy never drops the other page.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify master
        if: github.ref == 'refs/heads/master'
        run: npm ci && npm run verify

      - name: Build production (/) and development (/dev/)
        run: sh scripts/build-pages.sh site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
