name: CI

# Every pull request and every push to a short-lived branch: type-check, tests, production build.
# master is covered by the deploy workflow, which verifies before publishing the dev page.
on:
  pull_request:
  push:
    branches-ignore: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
